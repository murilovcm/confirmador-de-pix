<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Caixa — Entrar</title>
<style>
  :root{--bg:#111418;--surface:#1A1F27;--linha:#252B35;--accent:#AEFF00;--txt:#FFF;--txt2:#9BA3AF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{width:100%;max-width:360px;text-align:center}
  .selo{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--linha);border-radius:9999px;padding:6px 14px;font-size:12.5px;color:var(--txt2);margin-bottom:22px}
  .selo i{width:7px;height:7px;border-radius:9999px;background:var(--accent);display:block}
  h1{font-size:29px;font-weight:800;letter-spacing:-.7px;line-height:1.15}
  p{color:var(--txt2);font-size:15px;margin-top:12px}
  input{width:100%;margin-top:28px;background:var(--surface);border:1px solid var(--linha);border-radius:14px;padding:16px;color:var(--txt);font-size:16px;text-align:center}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:12px;background:var(--accent);color:#0D0D0D;border:none;border-radius:9999px;height:54px;font-size:16px;font-weight:700;cursor:pointer}
  button:active{transform:scale(.98)}
  .erro{color:#FFB4AE;font-size:14px;margin-top:16px}
</style>
</head>
<body>
  <form class="card" method="post">
    <div class="selo"><i></i> Acesso restrito</div>
    <h1>{{ titulo|default('Caixa') }}</h1>
    <p>{{ subtitulo|default('Confirmação de Pix recebidos') }}</p>
    <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" autofocus required>
    <button type="submit">{{ botao|default('Entrar') }}</button>
    {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  </form>
</body>
</html>
